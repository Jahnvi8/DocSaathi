# Render Blueprint — deploys DocSaathi as ONE web service that hosts both the
# Express API and the built React client (Express serves client/dist).
#
# In the Render dashboard: New → Blueprint → pick this repo. Render reads this
# file, creates the service, and prompts you for GEMINI_API_KEY.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: docsaathi
    runtime: node
    plan: free
    # --include=dev is required: the build needs TypeScript, Vite and Tailwind,
    # which are devDependencies. (Do NOT set NODE_ENV=production here — that
    # makes `npm ci` skip devDependencies and the build fails with "tsc: not found".)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false # set this in the dashboard; never commit it
      - key: GEMINI_CHAT_MODEL
        value: gemini-flash-latest
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001
      - key: RAG_HYBRID
        value: "true"
      - key: RAG_QUERY_REWRITE
        value: "false"
      - key: RAG_RERANK
        value: "false"
    # ── Persistence ──────────────────────────────────────────────────────────
    # The vector store is a JSON file. On the free plan the filesystem is
    # ephemeral: uploaded documents are lost whenever the service restarts or
    # redeploys (fine for a demo — just re-upload). To keep them, move to the
    # Starter plan and uncomment the disk below (also uncomment STORE_PATH).
    #
    # disk:
    #   name: docsaathi-data
    #   mountPath: /var/data
    #   sizeGB: 1
    #
    # …and add to envVars:
    #   - key: STORE_PATH
    #     value: /var/data/store.json
